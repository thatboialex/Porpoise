name: Build Porpoise

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 lld-18 llvm-18 \
            llvm-18-dev libclang-18-dev libclc-18-dev libllvmspirvlib-18-dev \
            spirv-tools spirv-headers glslang-tools glslang-dev \
            cmake make ninja-build meson \
            python3 python3-pip python3-pil python3-mako python3-yaml python3-ply python3-packaging \
            git wget curl unzip zip rsync \
            libelf-dev libexpat1-dev libdrm-dev libwayland-dev wayland-protocols \
            bison flex byacc \
            zlib1g-dev pkg-config

      - name: Install modern Meson
        run: |
          python3 -m pip install --user --break-system-packages 'meson>=1.4,<2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      # ---------- checkouts (sibling layout) ----------
      - name: Checkout Porpoise
        uses: actions/checkout@v4
        with:
          path: Porpoise

      - name: Checkout PS5_PayloadSDK
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_PayloadSDK
          path: PS5_PayloadSDK
          fetch-depth: 0          # setup script needs full history for the pinned revision

      - name: Checkout PS5_Vulkan
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Vulkan
          path: PS5_Vulkan
          fetch-depth: 0

      - name: Checkout PS5_Mesa
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Mesa
          path: PS5_Mesa
          fetch-depth: 0

      # ---------- caches ----------
      - name: Cache Porpoise SDK and deps
        uses: actions/cache@v4
        with:
          path: |
            Porpoise/.deps/native
          key: porpoise-sdk-${{ hashFiles('Porpoise/tools/setup-native-dependencies.sh') }}
          restore-keys: porpoise-sdk-

      - name: Cache PS5_Vulkan SDK and RADV
        uses: actions/cache@v4
        with:
          path: |
            PS5_Vulkan/.deps
          key: vulkan-radv-${{ hashFiles('PS5_Vulkan/tools/setup-native-dependencies.sh', 'PS5_Vulkan/tools/build-radv.sh') }}
          restore-keys: vulkan-radv-

      - name: Cache Dolphin source
        uses: actions/cache@v4
        with:
          path: Porpoise/.deps/dolphin-src
          key: dolphin-${{ hashFiles('Porpoise/tools/build-dolphin.sh') }}
          restore-keys: dolphin-

      # ---------- SDK (each project pins its own revision) ----------
      - name: Bootstrap Porpoise SDK
        working-directory: Porpoise
        env:
          PS5_PAYLOAD_SDK_FORK: ${{ github.workspace }}/PS5_PayloadSDK
        run: bash tools/setup-native-dependencies.sh

      - name: Bootstrap PS5_Vulkan SDK
        working-directory: PS5_Vulkan
        env:
          PS5_PAYLOAD_SDK_FORK: ${{ github.workspace }}/PS5_PayloadSDK
        run: bash tools/setup-native-dependencies.sh

      # ---------- RADV ----------
      - name: Build RADV (release)
        working-directory: PS5_Vulkan
        env:
          PS5_PAYLOAD_SDK_FORK: ${{ github.workspace }}/PS5_PayloadSDK
          PS5_MESA_FORK: ${{ github.workspace }}/PS5_Mesa
        run: bash tools/build-radv.sh release

      # ---------- full build ----------
      - name: Build Porpoise
        working-directory: Porpoise
        env:
          PS5_VULKAN_DIR: ${{ github.workspace }}/PS5_Vulkan
          PS5_PAYLOAD_SDK_FORK: ${{ github.workspace }}/PS5_PayloadSDK
          PS5_MESA_FORK: ${{ github.workspace }}/PS5_Mesa
          JOBS: 4
        run: make porpoise

      # ---------- artifact ----------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Porpoise-PPSA99764
          path: Porpoise/dist/Porpoise-PPSA99764.zip
          if-no-files-found: error
